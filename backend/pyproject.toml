[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gantt-planner-backend"
version = "0.1.0"
description = "Iteration 1 domain and FastAPI foundation for AI Gantt Planner"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "pydantic>=2.11,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
